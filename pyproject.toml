[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oil-agent"
version = "0.1.0"
description = "Evidence-led refined-oil alerts with explicit delivery authorization"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4", "procrastinate>=3,<4",
  "langgraph>=1,<2", "httpx>=0.28,<1", "openpyxl>=3.1,<4",
  "cryptography>=44,<50",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/oil_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires explicitly configured isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/oil_agent/api/*.py" = ["B008"]
