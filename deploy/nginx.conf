worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # A 2 MB binary quote becomes about 2.67 MB in the bounded JSON envelope.
        client_max_body_size 3m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        location = /gateway-healthz { return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 65s;
            add_header Cache-Control no-store always;
        }
        location = /healthz { proxy_pass http://api:8000/healthz; }
        location = /readyz { proxy_pass http://api:8000/readyz; }
        location ~ (^|/)\. { deny all; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
