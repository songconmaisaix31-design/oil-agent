# No automatic certificate issuance, HTTP redirect or public listener activation.
worker_processes 1;
pid /tmp/nginx.pid;
# Nginx error lines can contain OAuth queries even when access logging is off.
error_log /dev/null emerg;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 127.0.0.1:8080;
        location = /gateway-healthz { return 200 "ok\n"; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/oil-tls/cert.pem;
        ssl_certificate_key /run/oil-tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 3m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        location /api/ {
            # No URI suffix/rewrite: callback bytes/signature headers pass through.
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 65s;
            proxy_cache off;
        }
        location = /healthz { proxy_pass http://api:8000/healthz; }
        location = /readyz { proxy_pass http://api:8000/readyz; }
        location ~ (^|/)\. { deny all; }
        # OAuth redirect is a SPA route, not a GET to the JSON session API.
        location / { try_files $uri $uri/ /index.html; }
    }
}
